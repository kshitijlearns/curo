# Daily contract check (MVP doc §4): record today's answers from the real services with the
# test account, then replay every recording through CURO's parsers. A failure means a vendor
# changed its output. Each service is skipped until its secret and variables are set in the
# repository's settings (docs/INTEGRATION.md → Contract tests).
name: Contracts

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      CURO_ENV_FILE: ""
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_REELS_ACTOR_ID: ${{ vars.APIFY_REELS_ACTOR_ID }}
      CONTRACT_TEST_ACCOUNT: ${{ vars.CONTRACT_TEST_ACCOUNT }}
      CONTRACT_APIFY_REELS_INPUT: ${{ vars.CONTRACT_APIFY_REELS_INPUT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL_FAST: ${{ vars.CLAUDE_MODEL_FAST || 'claude-haiku-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/constraints.txt
      - run: pip install -c api/constraints.txt -e "api[dev,live]"
      - name: Record today's answers
        run: |
          if [ -n "$APIFY_TOKEN" ] && [ -n "$APIFY_REELS_ACTOR_ID" ] && [ -n "$CONTRACT_APIFY_REELS_INPUT" ]; then
            python tools/record_contracts.py apify reels --account "$CONTRACT_TEST_ACCOUNT" \
              --input "$CONTRACT_APIFY_REELS_INPUT" --name daily
          fi
          if [ -n "$GEMINI_API_KEY" ] && [ -n "$GEMINI_EMBEDDING_MODEL" ]; then
            python tools/record_contracts.py gemini-embed "One kurta, five dupattas" \
              "3 mistakes ruining your aesthetic reel" --name daily
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python tools/record_contracts.py claude T4 --input api/tests/contract_inputs/T4.json --name daily
          fi
      - name: Replay every recording
        working-directory: api
        run: pytest tests/test_contracts.py -v
