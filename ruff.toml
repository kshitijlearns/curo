# One Ruff config for all Python in the repo (api, worker, tools, fixtures).
line-length = 100
target-version = "py312"
extend-exclude = ["api/prompts", "reference", "app"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # allow typographic quotes and ₹ in copy strings
  "E501",  # `ruff format` keeps code at 100; long SQL and copy strings are left whole
]

[lint.isort]
known-first-party = ["curo", "curo_worker"]

[lint.flake8-bugbear]
# FastAPI's documented dependency pattern
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
