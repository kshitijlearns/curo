  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

    </div>

<body>
  <div id="__bundler_placeholder">Loading CURO prototype...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

column; gap: 6px\">\n                <span style=\"font-size: 16.5px; line-height: 1.4; font-weight: 600\">{{idea.title}}<\u002Fspan>\n                <span style=\"font-size: 13px; line-height: 1.5; color: rgba(36,36,36,.72)\">{{idea.why}}<\u002Fspan>\n              <\u002Fspan>\n              <span class=\"spring\" style=\"flex: 0 0 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid {{idea.ring}}; background: {{idea.dot}}; display: grid; place-items: center; color: #FFFFFF; transform: scale({{idea.dotScale}})\">\n                <sc-if value=\"{{idea.sel}}\" hint-placeholder-val=\"{{false}}\"><svg class=\"pop\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <sc-if value=\"{{hasPick}}\" hint-placeholder-val=\"{{false}}\">\n        <button type=\"button\" sc-camel-on-click=\"{{continueIdea}}\" class=\"rise press spring lift\" style=\"height: 56px; border-radius: 28px; border: none; background: #5B73F2; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 24px; cursor: pointer; margin-top: 4px\">\n          Develop this idea\n          <span style=\"width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #5B73F2; display: grid; place-items: center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ---------- Stage 2: script (before ge laceholder-val=\"{{false}}\">\n    <div class=\"ani\" style=\"display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"background: #E4E4EC; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(36,36,36,.72)\">{{oppLabel}}<\u002Fspan>\n        <div style=\"font-size: 16px; font-weight: 600; line-height: 1.35\">{{idea.title}}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{hasExchange}}\" hint-placeholder-val=\"{{false}}\">\n        <div class=\"ani\" style=\"display: flex; flex-direction: column; gap: 8px\">\n          <sc-if value=\"{{exchange.hasUser}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"display: flex; justify-content: flex-end\"><div style=\"max-width: 78%; background: #C3BFF2; color: #242424; border-radius: 22px 22px 6px 22px; padding: 10px 16px; font-size: 15px; line-height: 1.45\">{{exchange.user}}<\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display: flex; gap: 8px; align-items: flex-end\">\n            <span style=\"flex: 0 0 28px; height: 28px; border-radius: 50%; background: #5B73F2; color: #FFFFFF; display: grid; place-items: center\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2c.8 5.6 3.4 8.2 9 9-5.6.8-8.2 3.4-9 9-.8-5.6-3.4-8.2-9-9 5.6-.8 8.2-3.4 9-9z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <div style=\"max-width: 82%; background: #E4E4EC; border-radius: 22px 22px 22px 6px; padding: 10px 14px; font-size: 14px; line-height: 1.5\">{{exchange.curo}}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display: flex; justify-content: space-between; align-items: center; margin-top: 4px\">\n        <div style=\"display: flex; align-items: center; gap: 8px\">\n          <h2 style=\"margin: 0; font-size: 19px; font-wei =\"display: flex; justify-content: center; margin-top: 6px\">\n          <span class=\"pop\" style=\"height: 32px; padding: 0 14px; border-radius: 16px; background: #C3BFF2; color: #242424; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums\">{{curFrame.t}}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"fade\" style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 14px\">\n          <div style=\"background: #F2D4E2; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\">\n            <span style=\"font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase\">Script<\u002Fspan>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.55; font-weight: 600\">“{{curFrame.line}}”<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top: 12px; background: #E4E4EC; border-radius: 22px; padding: 4px 18px; display: flex; flex-direction: column\">\n          <div style=\"display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-bottom: 1px solid #FFFFFF\"><span style=\"font-size: 13px; color: rgba(36,36,36,.72)\">Shot<\u002Fspan><span style=\"font-size: 14px; font-weight: 600\">{{curFrame.shot}}<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-bottom: 1px solid #FFFFFF\"><span style=\"font-size: 13px; color: rgba(36,36,36,.72)\">Text on screen<\u002Fspan><span style=\"font-size: 14px; font-weight: 600\">{{curFrame.onScreen}}<\u002Fspan><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; padding: 12px 0\"><span style=\"font-size: 13px; color: rgba(36,36,36,.72)\">Transition<\u002Fspan><span style=\"font-size: 14px; font-weight: 600\">{{curFrame.trans}}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if va items: center\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2c.8 5.6 3.4 8.2 9 9-5.6.8-8.2 3.4-9 9-.8-5.6-3.4-8.2-9-9 5.6-.8 8.2-3.4 9-9z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <div style=\"max-width: 82%; background: #E4E4EC; border-radius: 22px 22px 22px 6px; padding: 10px 14px; font-size: 14px; line-height: 1.5\">{{capNote.curo}}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <button type=\"button\" sc-camel-on-click=\"{{toFinal}}\" class=\"press spring lift\" style=\"margin-top: 8px; height: 56px; border-radius: 28px; border: none; background: #5B73F2; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 24px; cursor: pointer\">\n        Continue to final draft\n        <span style=\"width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #5B73F2; display: grid; place-items: center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n\n    <!-- ---------- Stage: final draft ---------- -->\n    <sc-if value=\"{{stFinal}}\" hint-placeholder-val=\"{{false}}\">\n    <div class=\"ani\" style=\"display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"background: #F2D4E2; border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 6px\">\n        <span style=\"font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase\">{{oppLabel}}<\u002Fspan>\n        <span style=\"font-size: 20px; font-weight: 600; line-height: 1.3\">{{idea.title}}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"border: 1px solid #E4E4EC; border-radius: 26px; padding: 16px 18px; displa press spring lift\" style=\"height: 56px; border-radius: 28px; border: none; background: #5B73F2; color: #FFFFFF; font-size: 15.5px; font-weight: 600; cursor: pointer\">Save draft<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===================== SIMULATOR ===================== -->\n<sc-if value=\"{{isSim}}\" hint-placeholder-val=\"{{false}}\">\n<div>\n  <!-- intro: upload the recorded reel -->\n  <sc-if value=\"{{simIntro}}\" hint-placeholder-val=\"{{true}}\">\n  <div class=\"ani\" style=\"padding: 24px 20px 26px; display: flex; flex-direction: column; gap: 12px\">\n    <h2 style=\"margin: 0; font-size: 20px; font-weight: 600\">Simulate your recorded reel<\u002Fh2>\n    <p style=\"margin: -4px 0 4px; font-size: 14.5px; line-height: 1.55; color: rgba(36,36,36,.72)\">Upload the video once you’ve recorded it. Curo estimates how it’s likely to land before you post.<\u002Fp>\n    <sc-if value=\"{{uploadEmpty}}\" hint-placeholder-val=\"{{true}}\">\n      <button type=\"button\" sc-camel-on-click=\"{{mockUpload}}\" class=\"press spring lift\" style=\"height: 150px; border-radius: 24px; border: 1.5px dashed #5B73F2; background: #FFFFFF; color: #242424; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer\">\n        <span style=\"width: 48px; height: 48px; border-radius: 50%; background: #5B73F2; color: #FFFFFF; display: grid; place-items: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 16V4M6 10l6-6 6 6M4 20h16\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span style=\"font-size: 16px; font-weight: 600\">Upload your recorded reel<\u002Fspan>\n        <span style=\"font-size: 12.5px; color: rgba(36,36,36,.72)\">MP4 or MOV · up to 90 seconds<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-if>\n    <sc-if value=\"{{sim.uploading}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"fade\" style=\"height: 150px; border-radius: 24px; background: #E4E4EC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px\">\n        <svg class=\"spin\" width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 84 84\" aria-hidden=\"true\"><circle cx=\"42\" cy=\"42\" r=\"36\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"8\"><\u002Fcircle><circle cx=\"42\" cy=\"42\" r=\"36\" fill=\"none\" stroke=\"#5B73F2\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"70 157\"><\u002Fcircle><\u002Fsvg>\n        <span style=\"font-size: 14px; font-weight: 600\">Uploading {{uploadName}}…<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{sim.uploaded}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"rise\" style=\"display: flex; gap: 14px; align-items: center; border: 1.5px solid #5B73F2; border-radius: 24px; padding: 12px; background: #FFFFFF\">\n        <span style=\"flex: 0 0 56px; height: 76px; border-radius: 14px; overflow: hidden; display: block\"><dc-import name=\"ReelThumb\" tone=\"{{2}}\" compact=\"{{true}}\" height=\"{{76}}\" hint-size=\"56px,76px\"><\u002Fdc-import><\u002Fspan>\n        <span style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n          <span style=\"font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{uploadName}}<\u002Fspan>\n          <span style=\"font-size: 12.5px; color: rgba(36,36,36,.72)\">0:32 · 1080 × 1920 · ready<\u002Fspan>\n        <\u002Fspan>\n        <button type=\"button\" sc-camel-on-click=\"{{replaceUpload}}\" class=\"press spring soft\" style=\"height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid #C3BFF2; background: #FFFFFF; color: #242424; font-size: 12.5px; font-weight: 600; cursor: pointer\">Replace<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{hasStudioIdea}}\" hint-placeholder-val=\"{{true}}\">\n      <button type=\"button\" sc-camel-on-click=\"{{toggleLink}}\" role=\"switch\" aria-checked=\"{{sim.linked}}\" class=\"press spring\" style=\"text-align: left; border: 1px solid #E4E4EC; background: #FFFFFF; color: #242424; border-radius: 22px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; cursor: pointer\">\n        <span style=\"flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0\">\n          <span style=\"font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(36,36,36,.72)\">Compare with Studio draft<\u002Fspan>\n          <span style=\"font-size: 14.5px; font-weight: 600; line-height: 1.35\">{{studioIdeaTitle}}<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"flex: 0 0 46px; width: 46px; height: 28px; border-radius: 14px; background: {{linkTrack}}; position: relative; transition: background-color .25s ease\">\n          <span class=\"spring\" style=\"position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; transform: translateX({{linkKnob}}px)\"><\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-if>\n\n    <h2 style=\"margin: 10px 0 0; font-size: 18px; font-weight: 600\">Who is this for?<\u002Fh2>\n    <div role=\"radiogroup\" aria-label=\"Target audience\" style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n      <sc-for list=\"{{audOpts}}\" as=\"ao\" hint-placeholder-count=\"3\">\n        <button type=\"button\" role=\"radio\" aria-checked=\"{{ao.on}}\" sc-camel-on-click=\"{{ao.pick}}\" class=\"press spring\" style=\"height: 42px; padding: 0 18px; border-radius: 21px; border: none; background: {{ao.bg}}; color: {{ao.fg}}; font-size: 14px; font-weight: {{ao.weight}}; cursor: pointer; transform: scale({{ao.scale}})\">{{ao.label}}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin: 2px 2px 0; font-size: 13px; line-height: 1.6; color: rgba(36,36,36,.72)\">Curo compares your reel with your last 48 reels, your audience’s past behaviour and 1,240 similar posts from the past 30 days.<\u002Fp>\n    <button type=\"button\" sc-camel-on-click=\"{{runSimBtn}}\" disabled=\"{{runDisabled}}\" class=\"press spring lift\" style=\"margin-top: 6px; height: 58px; border-radius: 29px; border: none; background: #5B73F2; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 24px; cursor: pointer; opacity: {{runOpacity}}\">\n      Run simulation\n      <span style=\"width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; color: #5B73F2; display: grid; place-items: center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l3-7 4 14 3-7h4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- loading -->\n  <sc-if value=\"{{simLoading}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"fade\" style=\"display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 30px 20px 30px\">\n    <div style=\"position: relative; width: 84px; height: 84px; display: grid; place-items: center\">\n      <svg class=\"spin\" width=\"84\" height=\"84\" sc-camel-view-box=\"0 0 84 84\" style=\"position: absolute; inset: 0\" aria-hidden=\"true\">\n        <circle cx=\"42\" cy=\"42\" r=\"36\" fill=\"none\" stroke=\"#E4E4EC\" stroke-width=\"6\"><\u002Fcircle>\n        <circle cx=\"42\" cy=\"42\" r=\"36\" fill=\"none\" stroke=\"#5B73F2\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-dasharray=\"70 157\"><\u002Fcircle>\n      <\u002Fsvg>\n      <span style=\"width: 36px; height: 36px; border-radius: 50%; background: #C3BFF2; color: #5B73F2; display: grid; place-items: center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2c.8 5.6 3.4 8.2 9 9-5.6.8-8.2 3.4-9 9-.8-5.6-3.4-8.2-9-9 5.6-.8 8.2-3.4 9-9z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size: 17px; font-weight: 600; text-align: center\">Simulating “{{draftTitleShort}}”<\u002Fdiv>\n    <div style=\"align-self: stretch; display: flex; flex-direction: column; background: #E4E4EC; border-radius: 24px; padding: 6px 18px\">\n      <sc-for list=\"{{simSteps}}\" as=\"ss\" hint-placeholder-count=\"5\">\n        <div style=\"display: flex; align-items: center; gap: 12px; padding: 11px 0; color: {{ss.color}}; transition: color .3s ease\">\n          <span class=\"spring\" style=\"flex: 0 0 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid {{ss.ring}}; background: {{ss.fill}}; display: grid; place-items: center; color: #FFFFFF; transform: scale({{ss.scale}})\">\n            <sc-if value=\"{{ss.done}}\" hint-placeholder-val=\"{{false}}\"><svg class=\"pop\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n          <\u002Fspan>\n          <span style=\"font-size: 14.5px; font-weight: {{ss.weight}}\">{{ss.label}}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n\n  <!-- result -->\n  <sc-if value=\"{{simResult}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"ani\" style=\"display: flex; flex-direction: column\">\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 22px 20px 0\">\n      <button type=\"button\" sc-camel-on-click=\"{{backToDrafts}}\" aria-label=\"Back to upload\" class=\"press spring soft\" style=\"flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; border: none; background: #E4E4EC; color: #242424; : 12px; color: #E4E4EC\"><span style=\"width: 2px; height: 14px; border-radius: 1px; background: #FFFFFF\"><\u002Fspan>your baseline<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{simMetrics}}\" as=\"sm\" hint-placeholder-count=\"5\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.12)\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 8px\">\n            <span style=\"font-size: 14px; font-weight: 400\">{{sm.k}}<\u002Fspan>\n            <span style=\"font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums\">{{sm.val}}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,.14)\">\n            <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: {{sm.fill}}%; border-radius: 4px; background: {{sm.color}}; transition: width .7s cubic-bezier(.2,.8,.3,1.1)\"><\u002Fdiv>\n            <div style=\"position: absolute; top: -4px; bottom: -4px; left: {{sm.tick}}%; width: 2px; border-radius: 1px; background: #FFFFFF\"><\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-size: 12px; color: {{sm.deltaColor}}\">{{sm.delta}}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display: flex; gap: 12px; align-items: flex-start; padding: 14px 0 12px\">\n        <span style=\"flex: 0 0 36px; height: 36px; border-radius: 50%; background: #5B73F2; color: #FFFFFF; display: grid; place-items: center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div style=\"display: flex; flex-direction: column; gap: 3px\">\n          <span style=\"font-size: 14.5px; font-weight: 600\">Best time to post: {{bestTime.when}}<\u002Fspan>\n          <span style=\"font-size: 13px; line-height: 1.55; font-weight: 300; color: #E4E4EC\">{{bestTime.why}}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 style=\"margin: 8px 0 0; font-size: 20px; font-weight: 600\">What’s working<\u002Fh2>\n    <sc-for list=\"{{working}}\" as=\"w\" hint-placeholder-count=\"2\">\n      <div style=\"border: 1px solid #E4E4EC; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; gap: 12px; align-items: flex-start\">\n          <span style=\"flex: 0 0 30px; height: 30px; border-radius: 50%; background: #C3BFF2; color: #5B73F2; display: grid; place-items: center\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 1.55\">{{w.t}}<\u002Fspan>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{w.toggle}}\" aria-expanded=\"{{w.open}}\" class=\"press spring\" style=\"align-self: flex-start; margin-left: 42px; height: 32px; padding: 0 12px; border-radius: 16px; border: none; background: #E4E4EC; font-size: 12.5px; font-weight: 600; color: #242424; cursor: pointer; display: flex; align-items: center; gap: 4px\">{{w.evLabel}}<svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"transform: rotate({{w.rot}}deg); transition: transform .38s cubic-bezier(.2,.8,.3,1.25)\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <sc-if value=\"{{w.open}}\" hint-placeholder-val=\"{{false}}\">\n          <div class=\"fade\" style=\"display: flex; flex-direction: column; gap: 8px; margin-left: 42px\">\n            <sc-for list=\"{{w.ev}}\" as=\"ev\" hint-placeholder-count=\"2\">\n              <div class=\"rise\" style=\"display: flex; gap: 12px; align-items: center; background: #E4E4EC; border-radius: 18px; padding: 8px\">\n                <span style=\"flex: 0 0 42px; height: 58px; border-radius: 10px; overflow: hidden; display: block\"><dc-import name=\"ReelThumb\" tone=\"{{ev.tone}}\" compact=\"{{true}}\" height=\"{{58}}\" hint-size=\"42px,58px\"><\u002Fdc-import><\u002Fspan>\n                <span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n                  <span style=\"font-size: 12px; color: rgba(36,36,36,.72)\">{{ev.who}}<\u002Fspan>\n                  <span style=\"font-size: 13.5px; font-weight: 600; line-height: 1.3\">{{ev.title}}<\u002Fspan>\n                  <span style=\"font-size: 12.5px\">{{ev.stat}}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <h2 style=\"margin: 8px 0 0; font-size: 20px; font-weight: 600\">What’s holding it back<\u002Fh2>\n    <sc-for list=\"{{holding}}\" as=\"h\" hint-placeholder-count=\"3\">\n      <div class=\"spring\" style=\"border: 1px solid {{h.border}}; background: {{h.bg}}; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; gap: 12px; align-items: flex-start\">\n          <span class=\"spring\" style=\"flex: 0 0 30px; height: 30px; border-radius: 50%; background: {{h.markBg}}; color: {{h.markFg}}; display: grid; place-items: center; font-size: 15px; font-weight: 600\">{{h.mark}}<\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 1.55; color: {{h.color}}\">{{h.t}}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-left: 42px; align-items: center\">\n          <button type=\"button\" sc-camel-on-click=\"{{h. c-for>\n\n    <h2 style=\"margin: 8px 0 0; font-size: 20px; font-weight: 600\">What to change<\u002Fh2>\n    <p style=\"margin: -6px 2px 0; font-size: 13.5px; line-height: 1.55; color: rgba(36,36,36,.72)\">Pick the edits to apply. Curo updates your Studio script and storyboard, then re-runs.<\u002Fp>\n    <sc-for list=\"{{edits}}\" as=\"ed\" hint-placeholder-count=\"3\">\n      <button type=\"button\" sc-camel-on-click=\"{{ed.toggle}}\" aria-pressed=\"{{ed.on}}\" disabled=\"{{ed.applied}}\" class=\"press spring\" style=\"text-align: left; border: 1.5px solid {{ed.border}}; background: {{ed.bg}}; color: #242424; border-radius: 24px; padding: 16px; display: flex; gap: 12px; align-items: flex-start; cursor: {{ed.cursor}}; transform: translateY({{ed.lift}}px)\">\n        <span class=\"spring\" style=\"flex: 0 0 24px; height: 24px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid {{ed.ring}}; background: {{ed.dot}}; display: grid; place-items: center; color: #FFFFFF; margin-top: 1px; transform: scale({{ed.dotScale}})\">\n          <sc-if value=\"{{ed.checked}}\" hint-placeholder-val=\"{{false}}\"><svg class=\"pop\" width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n        <\u002Fspan>\n        <span style=\"flex: 1; display: flex; flex-direction: column; gap: 5px\">\n          <span style=\"display: flex; justify-content: space-between; gap: 8px; align-items: center\"><span style=\"font-size: 15px; font-weight: 600\">{{ed.title}}<\u002Fspan><span style=\"font-size: 12px; font-weight: 600; background: {{ed.gainBg}}; border-radius: 10px; padding: 2px 8px; white-space: nowrap\">{{ed.gainLabel}}<\u002Fspan><\u002Fspan>\n          <span style=\"font-size: 13.5px; line-height: 1.55; color: rgba(36,36,36,.72)\">{{ed.desc}}<\u002Fspan>\n          <span style=\"font-size: 12px;
